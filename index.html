<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纸张设计与打印生成器</title>

  <!-- 矢量 PDF 导出库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      direction: ltr !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #2b3a2f;
      color: #333333;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #253d2c;
      color: #ffffff;
      height: 52px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      user-select: none;
    }
    .brand-icon { font-size: 20px; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .lang-select {
      background: rgba(0, 0, 0, 0.25);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .lang-select option { background: #253d2c; color: #ffffff; }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      background: #e5e8e4;
      direction: ltr !important;
    }

    .sidebar {
      width: 440px;
      background: #ffffff;
      border-right: 1px solid #dcdfdc;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
      direction: ltr !important;
    }

    .export-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn-export {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 4px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-export:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-pdf { background: #2f6b48; }
    .btn-svg { background: #407b82; }
    .btn-png { background: #508ca4; }
    .btn-print { background: #536b88; }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid #f0f2f0;
      padding-bottom: 14px;
    }
    .form-section:last-child { border-bottom: none; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #2b3d2f;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-row { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; color: #666; }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7d1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }
    select:focus, input:focus {
      border-color: #2f6b48;
      box-shadow: 0 0 0 2px rgba(47, 107, 72, 0.15);
    }

    .btn-toggle-group {
      display: flex;
      border: 1px solid #cfd6d0;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .btn-toggle {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      border: none;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #555;
      transition: background 0.2s, color 0.2s;
    }
    .btn-toggle.active {
      background: #2f4b36;
      color: #ffffff;
      font-weight: 500;
    }
    .sub-hint { font-size: 11px; color: #7b8a7f; line-height: 1.4; }

    .margin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-swatch-box {
      width: 48px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #cfd6d0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }
    .color-swatch-box input[type="color"] {
      width: 60px;
      height: 60px;
      border: none;
      cursor: pointer;
      background: transparent;
    }

    .color-preset-list {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .preset-dot {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .preset-dot:hover { transform: scale(1.15); }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #444;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-item input {
      accent-color: #2f6b48;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    .preview-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #737c76;
      position: relative;
      direction: ltr !important;
    }
    .viewport-toolbar {
      background: #ffffff;
      padding: 8px 16px;
      border-bottom: 1px solid #d3d8d4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #555;
      flex-shrink: 0;
      direction: ltr !important;
    }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; }
    .badge-info {
      background: #f0f4f1;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #d8dfda;
      font-weight: 500;
    }
    .btn-tool {
      background: #f4f6f5;
      border: 1px solid #d0d7d1;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-tool:hover { background: #e8ebe9; }

    .canvas-scroll-container {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px;
    }
    .paper-sheet {
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      transform-origin: top center;
      transition: transform 0.2s ease-out;
    }
    #renderCanvas { display: block; }

    @media print {
      body * { visibility: hidden; }
      #renderCanvas, .paper-sheet {
        visibility: visible;
        position: absolute;
        left: 0;
        top: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <div class="brand-area">
      <span class="brand-icon">📄</span>
      <span id="uiBrandTitle">纸张设计与打印生成器</span>
    </div>
    <div class="header-actions">
      <select class="lang-select" id="langSelect">
        <option value="zh" selected>🇨🇳 简体中文</option>
        <option value="en">🇺🇸 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
      </select>
    </div>
  </header>

  <!-- 主体工作区 -->
  <main>
    <!-- 左侧控制面板 -->
    <aside class="sidebar" id="mainSidebar">
      <!-- 导出按钮栏 -->
      <div class="export-grid">
        <button class="btn-export btn-pdf" id="btnExportPDF">
          <span>📄</span><span data-i18n="export_pdf">导出 PDF</span>
        </button>
        <button class="btn-export btn-svg" id="btnExportSVG">
          <span>📐</span><span data-i18n="export_svg">导出 SVG</span>
        </button>
        <button class="btn-export btn-png" id="btnExportPNG">
          <span>🖼️</span><span data-i18n="export_png">导出 PNG</span>
        </button>
        <button class="btn-export btn-print" id="btnPrint">
          <span>🖨️</span><span data-i18n="print_now">即刻打印</span>
        </button>
      </div>

      <!-- 打印机类型 -->
      <div class="form-section">
        <div class="section-title">
          <span>🖨️</span><span data-i18n="printer_type">打印机类型</span>
        </div>
        <div class="btn-toggle-group">
          <button class="btn-toggle active" id="btnPrinterColor">🎨 <span data-i18n="color_printer">彩色打印机</span></button>
          <button class="btn-toggle" id="btnPrinterMono">🌓 <span data-i18n="mono_printer">黑白激光打印机</span></button>
        </div>
        <div class="sub-hint" id="printerHint" data-i18n="printer_hint">全彩：可使用主题和取色器。</div>
      </div>

      <!-- 纸张类型 (完整近60项全分类还原) -->
      <div class="form-section">
        <div class="section-title">
          <span>📋</span><span data-i18n="paper_type">纸张类型</span>
        </div>
        <select id="paperTypeSelect">
          <optgroup label="—— 基础线格 ——">
            <option value="lined">横线纸</option>
            <option value="vertical_lined">竖线纸</option>
            <option value="grid">方格纸</option>
            <option value="dot">点阵纸</option>
            <option value="pink_grid">粉色毫米方格纸</option>
            <option value="split_notes">分栏笔记纸</option>
            <option value="blank">空白纸</option>
            <option value="music_stave">乐谱纸</option>
            <option value="guitar_tab">吉他六线谱</option>
            <option value="bass_tab">贝斯四线谱</option>
            <option value="ukulele_tab">五线谱+TAB (尤克里里)</option>
            <option value="guitar_chord">带和弦图的高音五线谱 (吉他)</option>
            <option value="calligraphy_base">书法纸</option>
            <option value="slant_guide_55">现代书法斜线引导纸 (55°)</option>
            <option value="slant_grid_koca">斜线格纸 (коса лінійка)</option>
            <option value="cornell">康奈尔笔记</option>
            <option value="iso_grid">等距网格</option>
            <option value="perspective_grid">透视网格纸</option>
            <option value="hex_grid">六边形网格</option>
            <option value="french_grid">法式田字格</option>
            <option value="storyboard">分镜纸</option>
          </optgroup>
          <optgroup label="—— 作业纸 ——">
            <option value="pinyin_homework">汉语拼音作业纸</option>
            <option value="pinyin_tian">拼音田字格</option>
            <option value="composition">作文纸</option>
            <option value="genko_yoshi">原稿用纸 (日式稿纸)</option>
            <option value="arithmetic">算术纸</option>
            <option value="english_homework">英语作业纸</option>
            <option value="english_calligraphy">英文书法练习纸</option>
            <option value="us_kindergarten">美式幼儿书写纸</option>
            <option value="german_lineatur1">德式三线练习纸</option>
            <option value="german_lineatur_border">德式三线练习纸 (带边框)</option>
            <option value="german_lineatur3">德标三年级练字格 (Lineatur 3)</option>
            <option value="brazilian_calligraphy">巴西书法纸 (Caderno de Caligrafia)</option>
            <option value="general_practice">练习纸</option>
            <option value="braille_practice">盲文练习纸</option>
          </optgroup>
          <optgroup label="—— 书法练习纸 ——">
            <option value="mi_zi_ge" selected>米字格</option>
            <option value="hui_gong_ge">回宫格</option>
            <option value="jiu_gong_ge">九宫格</option>
            <option value="tian_zi_ge">中国田字格</option>
            <option value="cross_grid">交叉格</option>
            <option value="knitting_grid">编织图格纸</option>
            <option value="rect_hui_gong">长方回宫格</option>
          </optgroup>
          <optgroup label="—— 新增纸张 ——">
            <option value="vintage_notes">复古笔记纸</option>
            <option value="doodle_paper">儿童涂鸦纸</option>
            <option value="minimal_journal">简约手账纸</option>
            <option value="student_notes">学生笔记纸</option>
            <option value="meeting_notes">会议笔记纸</option>
            <option value="project_planner">项目规划纸</option>
            <option value="task_planner">任务计划表</option>
            <option value="chore_list">周清单 / 家务表</option>
            <option value="weekly_plan">周计划表</option>
            <option value="daily_plan">日计划表</option>
            <option value="weekly_meal">一周食谱计划</option>
            <option value="polar">极坐标纸</option>
            <option value="number_line">数轴练习纸</option>
            <option value="semi_log">半对数坐标纸</option>
            <option value="log_log">双对数坐标纸</option>
            <option value="hundred_board">十格 / 百数表</option>
            <option value="habit_tracker">月度习惯追踪</option>
            <option value="weather_tracker">月度气候追踪</option>
            <option value="workout_log">训练日志</option>
            <option value="monthly_calendar">月历</option>
            <option value="clock_practice">空白钟面练习纸</option>
            <option value="recipe_card">空白菜谱卡</option>
            <option value="fraction_wall">分数条 / 分数墙</option>
            <option value="sewing">缝纫裁剪格纸</option>
            <option value="swot">SWOT 分析表</option>
            <option value="medication_tracker">用药追踪表</option>
            <option value="target_thermometer">目标温度计</option>
            <option value="family_budget">家庭预算表</option>
            <option value="sketch_paper">草图纸</option>
            <option value="creative_log">创意记录纸</option>
            <option value="brand_custom">品牌定制纸</option>
            <option value="error_notebook">错题整理本</option>
            <option value="chinese_prep">语文预习卡</option>
            <option value="vocab_practice">汉英互译单词练习纸</option>
          </optgroup>
        </select>
      </div>

      <!-- 纸张尺寸 (完整规范还原) -->
      <div class="form-section">
        <div class="section-title">
          <span>📐</span><span data-i18n="paper_size_title">纸张尺寸</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="btn-toggle-group" style="width: 140px;">
            <button class="btn-toggle active" id="btnUnitMm">公制 (毫米)</button>
            <button class="btn-toggle" id="btnUnitIn">英制 (英寸)</button>
          </div>
          <div class="btn-toggle-group" style="width: 160px;">
            <button class="btn-toggle active" id="btnOrientV" data-i18n="portrait">纵向</button>
            <button class="btn-toggle" id="btnOrientH" data-i18n="landscape">横向</button>
          </div>
        </div>
        <select id="paperStandardSelect" style="margin-top: 6px;">
          <option value="A4" selected>A4 (210 × 297 mm)</option>
          <option value="A5">A5 (148 × 210 mm)</option>
          <option value="A3">A3 (297 × 420 mm)</option>
          <option value="B4">B4 (250 × 353 mm)</option>
          <option value="B5">B5 (176 × 250 mm)</option>
          <option value="Letter">Letter (8.5 × 11 in)</option>
          <option value="Legal">Legal (8.5 × 14 in)</option>
          <option value="Tabloid">Tabloid (11 × 17 in)</option>
          <option value="Executive">Executive (7.25 × 10.5 in)</option>
          <option value="Custom">自定义尺寸</option>
        </select>
      </div>

      <!-- 主题配色 (全套完整还原) -->
      <div class="form-section">
        <div class="section-title">
          <span>🎨</span><span data-i18n="theme_color">主题</span>
        </div>
        <select id="themeSelect">
          <option value="default">默认主题</option>
          <option value="dark">夜间主题</option>
          <option value="vintage_brown">复古棕</option>
          <option value="vintage" selected>复古风</option>
          <option value="soft">柔和色</option>
          <option value="classic">经典风</option>
          <option disabled>---- 新增主题 ----</option>
          <option value="minimal">极简风</option>
          <option value="marine">海洋风</option>
          <option value="forest">森林风</option>
          <option value="sunset">日落风</option>
          <option value="tech">科技风</option>
          <option value="elegant">优雅风</option>
          <option value="creative">创意风</option>
        </select>
      </div>

      <!-- 线条样式 -->
      <div class="form-section">
        <div class="section-title">
          <span>✏️</span><span data-i18n="line_style">线条样式</span>
        </div>
        <div class="form-row">
          <span class="form-label">线条颜色</span>
          <div class="color-picker-row">
            <div class="color-swatch-box">
              <input type="color" id="lineColorPicker" value="#8b5a2b" />
            </div>
            <input type="text" id="lineColorText" value="#8b5a2b" style="flex:1;" />
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:4px;">
          <div class="form-row" style="flex:1;">
            <span class="form-label" data-i18n="line_type">线条样式</span>
            <select id="lineDashSelect">
              <option value="solid" selected data-i18n="solid">实线</option>
              <option value="dashed" data-i18n="dashed">虚线</option>
              <option value="dotted" data-i18n="dotted">点线</option>
            </select>
          </div>
          <div class="form-row" style="flex:1;">
            <span class="form-label" data-i18n="line_width">线条粗细 (px)</span>
            <input type="number" id="inputLineWidth" value="0.6" step="0.05" min="0.1" max="5" />
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:4px;">
          <div class="form-row" style="flex:1;">
            <span class="form-label" id="labelSpacing">米字格大小 (in)</span>
            <input type="number" id="inputGridSpacing" value="0.787" step="0.01" min="0.1" max="50" />
          </div>
          <div class="form-row" style="flex:1;">
            <span class="form-label" data-i18n="bold_step">每 N 格加粗</span>
            <input type="number" id="inputBoldStep" value="0" step="1" min="0" max="20" />
          </div>
        </div>
      </div>

      <!-- 边距设置 -->
      <div class="form-section">
        <div class="section-title">
          <span>🔲</span><span data-i18n="margin_settings">边距设置</span>
        </div>
        <div class="sub-hint" style="margin-bottom:2px;">边距 (in)</div>
        <div class="margin-grid">
          <div class="form-row">
            <input type="number" id="marginTop" value="0.354" step="0.01" min="0" />
          </div>
          <div class="form-row">
            <input type="number" id="marginRight" value="0.354" step="0.01" min="0" />
          </div>
          <div class="form-row">
            <input type="number" id="marginBottom" value="0.354" step="0.01" min="0" />
          </div>
          <div class="form-row">
            <input type="number" id="marginLeft" value="0.354" step="0.01" min="0" />
          </div>
        </div>
      </div>

      <!-- 打孔定位标记 (全套选项还原) -->
      <div class="form-section">
        <div class="section-title">
          <span>🔘</span><span data-i18n="punch_marker">打孔定位标记</span>
        </div>
        <div class="sub-hint" style="margin-bottom:4px;">在纸上加黑色定位点，用手动打孔器每次都能打在同一位置。所有纸型都可使用。</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label class="checkbox-item"><input type="checkbox" id="chkPunchNone" checked /> <span data-i18n="punch_none">无孔</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchUS3" /> <span data-i18n="punch_us3">美式 3 孔活页夹 (左侧, 孔距 4.25 英寸)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchISO2" /> <span data-i18n="punch_iso2">2 孔 (左侧, 孔距 80 毫米)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchISO4" /> <span data-i18n="punch_iso4">4 孔 (左侧, 孔距 80 毫米)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunch5Hole" /> <span data-i18n="punch_5hole">5 孔 (左侧, 兼容 3 孔和 2 孔)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchTop2" /> <span data-i18n="punch_top2">顶部 2 孔 (顶部夹子文件夹, 孔距 2.75 英寸)</span></label>

    // 纸张物理尺寸对照表 (毫米 mm)
    const PAPER_SIZES_MM = {
      'A4': { w: 210, h: 297 },
      'A5': { w: 148, h: 210 },
      'A3': { w: 297, h: 420 },
      'B4': { w: 250, h: 353 },
      'B5': { w: 176, h: 250 },
      'Letter': { w: 215.9, h: 279.4 },
      'Legal': { w: 215.9, h: 355.6 },
      'Tabloid': { w: 279.4, h: 431.8 },
      'Executive': { w: 184.15, h: 266.7 },
      'Custom': { w: 210, h: 297 }
    };

    // 全套配色主题预设
    const THEME_PRESETS = {
      default: { line: '#4a5b5c', bg: '#ffffff' },
      dark: { line: '#1f2421', bg: '#f5f5f5' },
      vintage_brown: { line: '#5c3a21', bg: '#fcf8ee' },
      vintage: { line: '#8b5a2b', bg: '#fcfaf2' },
      soft: { line: '#8a7d74', bg: '#fbfaf8' },
      classic: { line: '#2c4a6f', bg: '#ffffff' },
      minimal: { line: '#111111', bg: '#ffffff' },
      marine: { line: '#0f6479', bg: '#f2f8fa' },
      forest: { line: '#205c3b', bg: '#f4f8f4' },
      sunset: { line: '#a34828', bg: '#fdf7f4' },
      tech: { line: '#1d3557', bg: '#f8fafc' },
      elegant: { line: '#6a4c93', bg: '#fbf8fd' },
      creative: { line: '#d90429', bg: '#fffafa' }
    };

    // 状态对象
    const state = {
      lang: 'zh',
      isMono: false,
      paperType: 'mi_zi_ge',
      standardSize: 'A4',
      isLandscape: false,
      unit: 'in',
      lineColor: '#8b5a2b',
      bgColor: '#ffffff',
      lineDash: 'solid',
      lineWidth: 0.6,
      gridSpacingIn: 0.787,
      boldStep: 0,
      marginTopIn: 0.354,
      marginBottomIn: 0.354,
      marginLeftIn: 0.354,
      marginRightIn: 0.354,
      texture: 'none',
      enableSidebar: false,
      sidebarPos: 'left',
      sidebarWidthIn: 0.984,
      sidebarColor: '#8b5a2b',
      sidebarDash: 'solid',
      sidebarBgColor: '#fcfaf2',
      enableWatermark: false,
      watermarkText: 'CONFIDENTIAL',
      punch: {
        none: true,
        us3: false,
        iso2: false,
        iso4: false,
        punch5: false,
        top2: false,
        single: false
      },
      zoom: 0.55
    };

    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const paperSheet = document.getElementById('paperSheet');

    const RENDER_DPI = 300;
    const MM_TO_INCH = 1 / 25.4;
    const INCH_TO_PX = RENDER_DPI;
    const MM_TO_PX = (RENDER_DPI * MM_TO_INCH);

    function setLanguage(langKey) {
      state.lang = langKey;
      const dict = I18N_DICT[langKey] || I18N_DICT.zh;
      document.getElementById('uiBrandTitle').textContent = dict.brand;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (dict[k]) el.textContent = dict[k];
      });
      document.getElementById('printerHint').textContent = state.isMono ? dict.printer_hint_mono : dict.printer_hint;
      updateToolbarInfo();
    }

    function drawPaper() {
      const sizeDef = PAPER_SIZES_MM[state.standardSize] || PAPER_SIZES_MM['A4'];
      const rawW_mm = state.isLandscape ? sizeDef.h : sizeDef.w;
      const rawH_mm = state.isLandscape ? sizeDef.w : sizeDef.h;

      const widthPx = Math.round(rawW_mm * MM_TO_PX);
      const heightPx = Math.round(rawH_mm * MM_TO_PX);

      canvas.width = widthPx;
      canvas.height = heightPx;

      paperSheet.style.width = (widthPx * state.zoom) + 'px';
      paperSheet.style.height = (heightPx * state.zoom) + 'px';
      canvas.style.width = (widthPx * state.zoom) + 'px';
      canvas.style.height = (heightPx * state.zoom) + 'px';

      // 1. 底色
      ctx.fillStyle = state.bgColor;
      ctx.fillRect(0, 0, widthPx, heightPx);

      // 2. 纹理
      if (state.texture !== 'none') {
        drawBackgroundTexture(ctx, widthPx, heightPx, state.texture);
      }

      // 3. 边距与区域计算
      const topPx = state.marginTopIn * INCH_TO_PX;
      const bottomPx = heightPx - (state.marginBottomIn * INCH_TO_PX);
      let leftPx = state.marginLeftIn * INCH_TO_PX;
      let rightPx = widthPx - (state.marginRightIn * INCH_TO_PX);

      // 4. 侧边栏
      if (state.enableSidebar) {
        const sideW_Px = state.sidebarWidthIn * INCH_TO_PX;
        ctx.save();
        ctx.strokeStyle = state.isMono ? '#333333' : state.sidebarColor;
        ctx.lineWidth = Math.max(1.8, state.lineWidth * 2.5);
        if (state.sidebarDash === 'dashed') ctx.setLineDash([12, 8]);
        else if (state.sidebarDash === 'dotted') ctx.setLineDash([3, 6]);
        else ctx.setLineDash([]);

        if (state.sidebarPos === 'left') {
          if (state.sidebarBgColor) {
            ctx.fillStyle = state.sidebarBgColor;
            ctx.fillRect(leftPx, topPx, sideW_Px, bottomPx - topPx);
          }
          const splitX = leftPx + sideW_Px;
          ctx.beginPath(); ctx.moveTo(splitX, topPx); ctx.lineTo(splitX, bottomPx); ctx.stroke();
          leftPx = splitX;
        } else {
          if (state.sidebarBgColor) {
            ctx.fillStyle = state.sidebarBgColor;
            ctx.fillRect(rightPx - sideW_Px, topPx, sideW_Px, bottomPx - topPx);
          }
          const splitX = rightPx - sideW_Px;
          ctx.beginPath(); ctx.moveTo(splitX, topPx); ctx.lineTo(splitX, bottomPx); ctx.stroke();
          rightPx = splitX;
        }
        ctx.restore();
      }

      // 5. 核心线条参数
      const baseLineColor = state.isMono ? '#444444' : state.lineColor;
      const boldLineColor = state.isMono ? '#111111' : state.lineColor;
      const stepPx = state.gridSpacingIn * INCH_TO_PX;

      ctx.save();
      ctx.strokeStyle = baseLineColor;
      ctx.lineWidth = state.lineWidth * 1.5;
      if (state.lineDash === 'dashed') ctx.setLineDash([12, 8]);
      else if (state.lineDash === 'dotted') ctx.setLineDash([3, 6]);
      else ctx.setLineDash([]);

      renderPaperTemplate(ctx, state.paperType, leftPx, topPx, rightPx, bottomPx, stepPx, baseLineColor, boldLineColor);
      ctx.restore();

      // 6. 水印
      if (state.enableWatermark && state.watermarkText.trim()) {
        ctx.save();
        ctx.font = `bold ${Math.round(widthPx * 0.08)}px sans-serif`;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.translate(widthPx / 2, heightPx / 2);
        ctx.rotate(-Math.PI / 4);
        ctx.fillText(state.watermarkText, 0, 0);
        ctx.restore();
      }

      // 7. 打孔定位标记
      if (!state.punch.none) {
        drawPunchMarkers(ctx, widthPx, heightPx);
      }

      updateToolbarInfo(rawW_mm, rawH_mm);
    }

    function renderPaperTemplate(ctx, type, left, top, right, bottom, step, baseColor, boldColor) {
      if (left >= right || top >= bottom || step <= 1) return;

      switch (type) {
        case 'grid':
        case 'sewing':
        case 'pink_grid':
        case 'rect_hui_gong':
        case 'knitting_grid': {
          let col = 0;
          for (let x = left; x <= right + 0.5; x += step) {
            const isMajor = state.boldStep > 0 && (col % state.boldStep === 0);
            ctx.lineWidth = isMajor ? state.lineWidth * 3.2 : state.lineWidth * 1.4;
            ctx.strokeStyle = isMajor ? boldColor : (type === 'pink_grid' ? '#f59e0b' : baseColor);
            ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
            col++;
          }
          let row = 0;
          for (let y = top; y <= bottom + 0.5; y += step) {
            const isMajor = state.boldStep > 0 && (row % state.boldStep === 0);
            ctx.lineWidth = isMajor ? state.lineWidth * 3.2 : state.lineWidth * 1.4;
            ctx.strokeStyle = isMajor ? boldColor : (type === 'pink_grid' ? '#f59e0b' : baseColor);
            ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
            row++;
          }
          break;
        }

        case 'lined':
        case 'vintage_notes':
        case 'student_notes':
        case 'meeting_notes': {
          for (let y = top; y <= bottom + 0.5; y += step) {
            ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
          }
          break;
        }

        case 'vertical_lined': {
          for (let x = left; x <= right + 0.5; x += step) {
            ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
          }
          break;
        }

        case 'dot': {
          ctx.fillStyle = baseColor;
          const r = state.lineWidth * 1.8;
          for (let x = left; x <= right + 0.5; x += step) {
            for (let y = top; y <= bottom + 0.5; y += step) {
              ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            }
          }
          break;
        }

        case 'mi_zi_ge':
        case 'tian_zi_ge':
        case 'hui_gong_ge':
        case 'jiu_gong_ge':
        case 'cross_grid': {
          const cellSize = step;
          for (let x = left; x + cellSize <= right + 1; x += cellSize) {
            for (let y = top; y + cellSize <= bottom + 1; y += cellSize) {
              ctx.setLineDash([]);
              ctx.lineWidth = state.lineWidth * 2.2;
              ctx.strokeStyle = boldColor;
              ctx.strokeRect(x, y, cellSize, cellSize);

              ctx.setLineDash([8, 8]);
              ctx.lineWidth = state.lineWidth * 1.0;
              ctx.strokeStyle = baseColor;

              if (type === 'mi_zi_ge' || type === 'tian_zi_ge' || type === 'cross_grid') {
                ctx.beginPath();
                ctx.moveTo(x + cellSize / 2, y); ctx.lineTo(x + cellSize / 2, y + cellSize);
                ctx.moveTo(x, y + cellSize / 2); ctx.lineTo(x + cellSize, y + cellSize / 2);
                ctx.stroke();
              }

              if (type === 'mi_zi_ge' || type === 'cross_grid') {
                ctx.beginPath();
                ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y + cellSize);
                ctx.moveTo(x + cellSize, y); ctx.lineTo(x, y + cellSize);
                ctx.stroke();
              }

              if (type === 'hui_gong_ge') {
                const inner = cellSize * 0.5;
                const offset = (cellSize - inner) / 2;
                ctx.strokeRect(x + offset, y + offset, inner, inner);
              }

              if (type === 'jiu_gong_ge') {
                const third = cellSize / 3;
                ctx.beginPath();
                ctx.moveTo(x + third, y); ctx.lineTo(x + third, y + cellSize);
                ctx.moveTo(x + third * 2, y); ctx.lineTo(x + third * 2, y + cellSize);
                ctx.moveTo(x, y + third); ctx.lineTo(x + cellSize, y + third);
                ctx.moveTo(x, y + third * 2); ctx.lineTo(x + cellSize, y + third * 2);
                ctx.stroke();
              }
            }
          }
          break;
        }

        case 'pinyin_tian':
        case 'pinyin_homework': {
          const cellSize = step;
          const pinyinH = cellSize * 0.45;
          let curY = top;
          while (curY + pinyinH + cellSize <= bottom) {
            ctx.setLineDash([]);
            ctx.lineWidth = state.lineWidth * 1.5;
            for (let i = 0; i <= 3; i++) {
              const py = curY + (pinyinH / 3) * i;
              ctx.beginPath(); ctx.moveTo(left, py); ctx.lineTo(right, py); ctx.stroke();
            }
            const gridTop = curY + pinyinH;
            for (let x = left; x + cellSize <= right; x += cellSize) {
              ctx.strokeRect(x, gridTop, cellSize, cellSize);
              ctx.setLineDash([6, 6]);
              ctx.beginPath();
              ctx.moveTo(x + cellSize / 2, gridTop); ctx.lineTo(x + cellSize / 2, gridTop + cellSize);
              ctx.moveTo(x, gridTop + cellSize / 2); ctx.lineTo(x + cellSize, gridTop + cellSize / 2);
              ctx.stroke();
              ctx.setLineDash([]);
            }
            curY += pinyinH + cellSize + (step * 0.35);
          }
          break;
        }

        case 'music_stave':
        case 'guitar_tab':
        case 'bass_tab':
        case 'ukulele_tab': {
          const linesCount = (type === 'bass_tab' || type === 'ukulele_tab') ? 4 : (type === 'guitar_tab' ? 6 : 5);
          const staveGap = step * 0.25;
          const groupGap = step * 1.8;
          let curY = top;
          while (curY + staveGap * (linesCount - 1) <= bottom) {
            ctx.setLineDash([]);
            ctx.lineWidth = state.lineWidth * 1.4;
            for (let i = 0; i < linesCount; i++) {
              const y = curY + i * staveGap;
              ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
            }
            curY += staveGap * (linesCount - 1) + groupGap;
          }
          break;
        }

        case 'cornell': {
          const cueWidth = (right - left) * 0.3;
          const summaryHeight = (bottom - top) * 0.22;
          const mainBottom = bottom - summaryHeight;

          ctx.setLineDash([]);
          ctx.lineWidth = state.lineWidth * 2.8;
          ctx.beginPath(); ctx.moveTo(left + cueWidth, top); ctx.lineTo(left + cueWidth, mainBottom); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(left, mainBottom); ctx.lineTo(right, mainBottom); ctx.stroke();

          ctx.lineWidth = state.lineWidth * 1.2;
          for (let y = top + step; y < mainBottom - 5; y += step) {
            ctx.beginPath(); ctx.moveTo(left + cueWidth, y); ctx.lineTo(right, y); ctx.stroke();
          }
          break;
        }

        case 'swot': {
          const midX = (left + right) / 2;
          const midY = (top + bottom) / 2;
          ctx.setLineDash([]);
          ctx.lineWidth = state.lineWidth * 3.0;
          ctx.beginPath(); ctx.moveTo(midX, top); ctx.lineTo(midX, bottom); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(left, midY); ctx.lineTo(right, midY); ctx.stroke();
          ctx.font = `bold ${Math.round(step * 0.8)}px sans-serif`;
          ctx.fillStyle = boldColor;
          ctx.fillText('S (Strengths)', left + 20, top + 40);
          ctx.fillText('W (Weaknesses)', midX + 20, top + 40);
          ctx.fillText('O (Opportunities)', left + 20, midY + 40);
          ctx.fillText('T (Threats)', midX + 20, midY + 40);
          break;
        }

        case 'polar': {
          const cx = (left + right) / 2;
          const cy = (top + bottom) / 2;
          const maxR = Math.min((right - left), (bottom - top)) / 2;
          ctx.setLineDash([]);
          for (let r = step; r <= maxR; r += step) {
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
          }
          for (let deg = 0; deg < 360; deg += 30) {
            const rad = deg * Math.PI / 180;
            ctx.beginPath(); ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(rad) * maxR, cy + Math.sin(rad) * maxR);
            ctx.stroke();
          }
          break;
        }

        case 'weekly_plan': {
          const dayW = (right - left) / 7;
          ctx.setLineDash([]);
          ctx.lineWidth = state.lineWidth * 2.2;
          for (let i = 0; i <= 7; i++) {
            const x = left + i * dayW;
            ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
          }
          const headerH = 60;
          ctx.beginPath(); ctx.moveTo(left, top + headerH); ctx.lineTo(right, top + headerH); ctx.stroke();
          for (let y = top + headerH + step; y < bottom; y += step) {
            ctx.lineWidth = state.lineWidth * 1.0;
            ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
          }
          break;
        }

        case 'blank':
        default:
          break;
      }
    }

    function drawBackgroundTexture(ctx, w, h, texType) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.04)';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
      ctx.lineWidth = 1;

      if (texType === 'slash') {
        const gap = 24;
        for (let x = -h; x < w; x += gap) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + h, h); ctx.stroke();
        }
      } else if (texType === 'backslash') {
        const gap = 24;
        for (let x = 0; x < w + h; x += gap) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x - h, h); ctx.stroke();
        }
      } else if (texType === 'dots' || texType === 'dense_dots') {
        const gap = texType === 'dense_dots' ? 14 : 30;
        for (let x = 10; x < w; x += gap) {
          for (let y = 10; y < h; y += gap) {
            ctx.fillRect(x, y, 2, 2);
          }
        }
      } else if (texType === 'grid') {
        const gap = 20;
        for (let x = 0; x < w; x += gap) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += gap) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
      } else if (texType === 'lines' || texType === 'v_lines') {
        const gap = 18;
        if (texType === 'lines') {
          for (let y = 0; y < h; y += gap) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
          }
        } else {
          for (let x = 0; x < w; x += gap) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
          }
        }
      } else if (texType === 'cross') {
        const gap = 26;
        for (let x = 0; x < w; x += gap) {
          for (let y = 0; y < h; y += gap) {
            ctx.beginPath();
            ctx.moveTo(x - 3, y); ctx.lineTo(x + 3, y);
            ctx.moveTo(x, y - 3); ctx.lineTo(x, y + 3);
            ctx.stroke();
          }
        }
      } else if (texType === 'checkerboard') {
        const gap = 32;
        let toggle = false;
        for (let x = 0; x < w; x += gap) {
          toggle = !toggle;
          for (let y = 0; y < h; y += gap) {
            if (toggle) ctx.fillRect(x, y, gap, gap);
            toggle = !toggle;
          }
        }
      }
      ctx.restore();
    }

    function drawPunchMarkers(ctx, w, h) {
      ctx.save();
      ctx.fillStyle = 'rgba(20, 20, 20, 0.85)';
      ctx.strokeStyle = 'rgba(20, 20, 20, 0.85)';
      ctx.lineWidth = 2;

      const punchR = 4 * (RENDER_DPI / 72);
      const edgeDist = 9.5 * MM_TO_PX;

      function drawHole(x, y) {
        ctx.beginPath(); ctx.arc(x, y, punchR, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
      }

      const centerY = h / 2;

      if (state.punch.us3) {
        const gap = 4.25 * 25.4 * MM_TO_PX;
        drawHole(edgeDist, centerY);
        drawHole(edgeDist, centerY - gap);
        drawHole(edgeDist, centerY + gap);
      }

      if (state.punch.iso2) {
        const gap = (80 / 2) * MM_TO_PX;
        drawHole(edgeDist, centerY - gap);
        drawHole(edgeDist, centerY + gap);
      }

      if (state.punch.iso4) {
        const half = 40 * MM_TO_PX;
        const outer = 120 * MM_TO_PX;
        drawHole(edgeDist, centerY - half);
        drawHole(edgeDist, centerY + half);
        drawHole(edgeDist, centerY - outer);
        drawHole(edgeDist, centerY + outer);
      }

      if (state.punch.punch5) {
        const gapUS = 4.25 * 25.4 * MM_TO_PX;
        const gapISO = (80 / 2) * MM_TO_PX;
        drawHole(edgeDist, centerY);
        drawHole(edgeDist, centerY - gapUS);
        drawHole(edgeDist, centerY + gapUS);
        drawHole(edgeDist, centerY - gapISO);
        drawHole(edgeDist, centerY + gapISO);
      }

      if (state.punch.top2) {
        const gap = (2.75 * 25.4 / 2) * MM_TO_PX;
        const centerX = w / 2;
        drawHole(centerX - gap, edgeDist);
        drawHole(centerX + gap, edgeDist);
      }

      if (state.punch.single) {
        drawHole(edgeDist * 1.5, edgeDist * 1.5);
      }

      ctx.restore();
    }

    function updateToolbarInfo(w_mm, h_mm) {
      if (!w_mm) {
        const def = PAPER_SIZES_MM[state.standardSize] || PAPER_SIZES_MM['A4'];
        w_mm = state.isLandscape ? def.h : def.w;
        h_mm = state.isLandscape ? def.w : def.h;
      }
      const typeName = document.getElementById('paperTypeSelect').selectedOptions[0].text;
      const orientName = state.isLandscape ? '横向' : '纵向';
      document.getElementById('badgePaperInfo').textContent = `${typeName} · ${state.standardSize} ${orientName}`;
      document.getElementById('badgePaperDimension').textContent = `${Math.round(w_mm)} × ${Math.round(h_mm)} mm`;
      document.getElementById('zoomPercentText').textContent = Math.round(state.zoom * 100) + '%';
    }

      const w_mm = state.isLandscape ? sizeDef.h : sizeDef.w;
      const h_mm = state.isLandscape ? sizeDef.w : sizeDef.h;

      const pdf = new jsPDF({
        orientation: state.isLandscape ? 'landscape' : 'portrait',

      });

      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(imgData, 'JPEG', 0, 0, w_mm, h_mm);
      pdf.save(`Paper-${state.paperType}-${state.standardSize}.pdf`);
    };

    const sidebarColorText = document.getElementById('sidebarColorText');
    sidebarColorPicker.oninput = (e) => { state.sidebarColor = e.target.value; sidebarColorText.value = e.target.value; drawPaper(); };
    sidebarColorText.onchange = (e) => { state.sidebarColor = e.target.value; sidebarColorPicker.value = e.target.value; drawPaper(); };

    document.getElementById('sidebarDashSelect').onchange = (e) => { state.sidebarDash = e.target.value; drawPaper(); };
    document.getElementById('sidebarBgColorPicker').oninput = (e) => { state.sidebarBgColor = e.target.value; drawPaper(); };
    document.getElementById('btnSidebarBgClear').onclick = () => { state.sidebarBgColor = null; drawPaper(); };

    // 背景色与预设色块
    document.getElementById('bgColorPicker').oninput = (e) => { state.bgColor = e.target.value; drawPaper(); };
    document.querySelectorAll('.preset-dot').forEach(dot => {
      dot.onclick = () => {
        state.bgColor = dot.getAttribute('data-color');
        document.getElementById('bgColorPicker').value = state.bgColor;
        drawPaper();
      };
    });

    document.getElementById('bgTextureSelect').onchange = (e) => { state.texture = e.target.value; drawPaper(); };

    // 水印
    const chkWatermark = document.getElementById('chkEnableWatermark');
    const watermarkBox = document.getElementById('watermarkBox');
    chkWatermark.onchange = (e) => {
      state.enableWatermark = e.target.checked;
      watermarkBox.style.display = e.target.checked ? 'block' : 'none';
      drawPaper();
    };
    document.getElementById('txtWatermark').oninput = (e) => { state.watermarkText = e.target.value; drawPaper(); };

    // 缩放
    document.getElementById('btnZoomIn').onclick = () => { state.zoom = Math.min(1.5, state.zoom + 0.05); drawPaper(); };
    document.getElementById('btnZoomOut').onclick = () => { state.zoom = Math.max(0.2, state.zoom - 0.05); drawPaper(); };
    document.getElementById('btnFitWindow').onclick = () => {
      const container = document.getElementById('scrollContainer');
      const availW = container.clientWidth - 80;
      const sizeDef = PAPER_SIZES_MM[state.standardSize] || PAPER_SIZES_MM['A4'];
      const rawW_mm = state.isLandscape ? sizeDef.h : sizeDef.w;
      const targetPx = rawW_mm * MM_TO_PX;
      state.zoom = Math.min(1.0, Math.max(0.25, availW / targetPx));
      drawPaper();
    };

    window.addEventListener('DOMContentLoaded', () => {
      setLanguage('zh');
      drawPaper();
    });
  </script>
</body>
</html>
