<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纸张设计与打印生成器</title>

  <!-- 矢量 PDF 导出库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 无论语言如何，强制整体布局保持统一的自左向右骨架，防止阿拉伯语镜像错位 */
    html, body {
      direction: ltr !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #2b3a2f;
      color: #333333;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 */
    header {
      background: #253d2c;
      color: #ffffff;
      height: 52px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .brand-icon {
      font-size: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-select {
      background: rgba(0, 0, 0, 0.25);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .lang-select option {
      background: #253d2c;
      color: #ffffff;
    }

    /* 主应用区 */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      background: #e5e8e4;
      direction: ltr !important;
    }

    /* 左侧控制栏 */
    .sidebar {
      width: 440px;
      background: #ffffff;
      border-right: 1px solid #dcdfdc;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
      direction: ltr !important;
    }

    /* 顶部导出按钮组 */
    .export-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-export {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 4px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-export:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-pdf { background: #2f6b48; }
    .btn-svg { background: #407b82; }
    .btn-png { background: #508ca4; }
    .btn-print { background: #536b88; }

    /* 表单与段落通用 */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid #f0f2f0;
      padding-bottom: 14px;
    }
    .form-section:last-child { border-bottom: none; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #2b3d2f;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 12px;
      color: #666;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7d1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }
    select:focus, input:focus {
      border-color: #2f6b48;
      box-shadow: 0 0 0 2px rgba(47, 107, 72, 0.15);
    }

    /* 打印机与方向双选按钮组 */
    .btn-toggle-group {
      display: flex;
      border: 1px solid #cfd6d0;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .btn-toggle {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      border: none;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #555;
      transition: background 0.2s, color 0.2s;
    }
    .btn-toggle.active {
      background: #2f4b36;
      color: #ffffff;
      font-weight: 500;
    }

    .sub-hint {
      font-size: 11px;
      color: #7b8a7f;
      line-height: 1.4;
    }

    /* 4向边距九宫格输入 */
    .margin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-swatch-box {
      width: 48px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #cfd6d0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }
    .color-swatch-box input[type="color"] {
      width: 60px;
      height: 60px;
      border: none;
      cursor: pointer;
      background: transparent;
    }

    /* 色彩预设色块圆点 */
    .color-preset-list {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .preset-dot {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .preset-dot:hover { transform: scale(1.15); }

    /* 复选框组 */
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #444;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-item input {
      accent-color: #2f6b48;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    /* 右侧画布视口区 */
    .preview-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #737c76;
      position: relative;
      direction: ltr !important;
    }

    /* 视口顶部状态工具栏 */
    .viewport-toolbar {
      background: #ffffff;
      padding: 8px 16px;
      border-bottom: 1px solid #d3d8d4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #555;
      flex-shrink: 0;
      direction: ltr !important;
    }
    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge-info {
      background: #f0f4f1;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #d8dfda;
      font-weight: 500;
    }

    .btn-tool {
      background: #f4f6f5;
      border: 1px solid #d0d7d1;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-tool:hover { background: #e8ebe9; }

    /* 画布滚动容器 */
    .canvas-scroll-container {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px;
    }

    /* 纸张阴影和包装 */
    .paper-sheet {
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      transform-origin: top center;
      transition: transform 0.2s ease-out;
    }

    #renderCanvas {
      display: block;
    }

    /* 隐藏的辅助打印区域 */
    @media print {
      body * { visibility: hidden; }
      #renderCanvas, .paper-sheet {
        visibility: visible;
        position: absolute;
        left: 0;
        top: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <div class="brand-area">
      <span class="brand-icon">📄</span>
      <span id="uiBrandTitle">纸张设计与打印生成器</span>
    </div>
    <div class="header-actions">
      <select class="lang-select" id="langSelect">
        <option value="zh" selected>🇨🇳 简体中文</option>
        <option value="en">🇺🇸 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
      </select>
    </div>
  </header>

  <!-- 主体工作区 -->
  <main>
    <!-- 左侧参数调节面板 -->
    <aside class="sidebar" id="mainSidebar">
      <!-- 导出按钮栏 -->
      <div class="export-grid">
        <button class="btn-export btn-pdf" id="btnExportPDF">
          <span>📄</span><span data-i18n="export_pdf">导出 PDF</span>
        </button>
        <button class="btn-export btn-svg" id="btnExportSVG">
          <span>📐</span><span data-i18n="export_svg">导出 SVG</span>
        </button>
        <button class="btn-export btn-png" id="btnExportPNG">
          <span>🖼️</span><span data-i18n="export_png">导出 PNG</span>
        </button>
        <button class="btn-export btn-print" id="btnPrint">
          <span>🖨️</span><span data-i18n="print_now">即刻打印</span>
        </button>
      </div>

      <!-- 打印机类型 -->
      <div class="form-section">
        <div class="section-title">
          <span>🖨️</span><span data-i18n="printer_type">打印机类型</span>
        </div>
        <div class="btn-toggle-group">
          <button class="btn-toggle active" id="btnPrinterColor">🎨 <span data-i18n="color_printer">彩色打印机</span></button>
          <button class="btn-toggle" id="btnPrinterMono">🌓 <span data-i18n="mono_printer">黑白激光打印机</span></button>
        </div>
        <div class="sub-hint" id="printerHint" data-i18n="printer_hint">全彩：可自由使用主题和取色器。</div>
      </div>

      <!-- 纸张类型 -->
      <div class="form-section">
        <div class="section-title">
          <span>📋</span><span data-i18n="paper_type">纸张类型</span>
        </div>
        <select id="paperTypeSelect">
          <optgroup label="—— 基础线格 ——">
            <option value="grid">方格纸 (Grid)</option>
            <option value="lined">横线纸 (Lined)</option>
            <option value="vertical_lined">竖线纸 (Vertical)</option>
            <option value="dot">点阵纸 (Dot Matrix)</option>
            <option value="sewing" selected>缝纫裁剪格纸 (Sewing Grid)</option>
            <option value="blank">纯空白纸 (Blank)</option>
          </optgroup>
          <optgroup label="—— 书法与练习纸 ——">
            <option value="mi_zi_ge">米字格 (书法)</option>
            <option value="tian_zi_ge">田字格 (楷书)</option>
            <option value="hui_gong_ge">回宫格</option>
            <option value="jiu_gong_ge">九宫格</option>
            <option value="pinyin_tian">拼音田字格</option>
            <option value="music_stave">五线谱纸 (Music Stave)</option>
            <option value="guitar_tab">吉他六线谱 (Guitar TAB)</option>
          </optgroup>
          <optgroup label="—— 笔记与图表 ——">
            <option value="cornell">康奈尔笔记纸 (Cornell)</option>
            <option value="swot">SWOT 分析表</option>
            <option value="polar">极坐标纸 (Polar Grid)</option>
            <option value="weekly_plan">周计划 / 习惯追踪</option>
          </optgroup>
        </select>
      </div>

      <!-- 纸张尺寸与方向 -->
      <div class="form-section">
        <div class="section-title">
          <span>📐</span><span data-i18n="paper_size_title">纸张尺寸与单位</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="btn-toggle-group" style="width: 140px;">
            <button class="btn-toggle active" id="btnUnitMm">mm</button>
            <button class="btn-toggle" id="btnUnitIn">inch</button>
          </div>
          <div class="btn-toggle-group" style="width: 160px;">
            <button class="btn-toggle active" id="btnOrientV" data-i18n="portrait">纵向</button>
            <button class="btn-toggle" id="btnOrientH" data-i18n="landscape">横向</button>
          </div>
        </div>
        <select id="paperStandardSelect" style="margin-top: 6px;">
          <option value="A4" selected>A4 (210 × 297 mm)</option>
          <option value="A5">A5 (148 × 210 mm)</option>
          <option value="A3">A3 (297 × 420 mm)</option>
          <option value="B5">B5 (176 × 250 mm)</option>
          <option value="Letter">Letter (8.5 × 11 in)</option>
          <option value="Legal">Legal (8.5 × 14 in)</option>
        </select>
      </div>

      <!-- 主题配色 -->
      <div class="form-section">
        <div class="section-title">
          <span>🎨</span><span data-i18n="theme_color">色彩主题</span>
        </div>
        <select id="themeSelect">
          <option value="vintage" selected>复古风 (Vintage Brown)</option>
          <option value="default">默认主题 (深青灰)</option>
          <option value="dark">夜间主题 (深黑灰)</option>
          <option value="classic">经典风 (淡蓝黑)</option>
          <option value="marine">海洋风 (薄荷海蓝)</option>
          <option value="forest">森林风 (墨竹深绿)</option>
          <option value="sunset">日落风 (暖霞砖红)</option>
        </select>
      </div>

      <!-- 线条样式 -->
      <div class="form-section">
        <div class="section-title">
          <span>✏️</span><span data-i18n="line_style">线条样式与规格</span>
        </div>
        <div class="color-picker-row">
          <div class="color-swatch-box">
            <input type="color" id="lineColorPicker" value="#8b5a2b" />
          </div>
          <input type="text" id="lineColorText" value="#8b5a2b" style="flex:1;" />
        </div>
        <div style="display:flex; gap:10px; margin-top:4px;">
          <div class="form-row" style="flex:1;">
            <span class="form-label" data-i18n="line_type">虚实样式</span>
            <select id="lineDashSelect">
              <option value="solid" selected data-i18n="solid">实线</option>
              <option value="dashed" data-i18n="dashed">虚线</option>
              <option value="dotted" data-i18n="dotted">点线</option>
            </select>
          </div>
          <div class="form-row" style="flex:1;">
            <span class="form-label" data-i18n="line_width">线条粗细 (px)</span>
            <input type="number" id="inputLineWidth" value="0.6" step="0.1" min="0.1" max="5" />
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:4px;">
          <div class="form-row" style="flex:1;">
            <span class="form-label" data-i18n="grid_spacing">格距大小 (mm)</span>
            <input type="number" id="inputGridSpacing" value="10" step="0.5" min="2" max="50" />
          </div>
          <div class="form-row" style="flex:1;">
            <span class="form-label" data-i18n="bold_step">每 N 格加粗</span>
            <input type="number" id="inputBoldStep" value="5" step="1" min="0" max="20" />
          </div>
        </div>
      </div>

      <!-- 边距设置 -->
      <div class="form-section">
        <div class="section-title">
          <span>🔲</span><span data-i18n="margin_settings">边距设置 (mm)</span>
        </div>
        <div class="margin-grid">
          <div class="form-row">
            <span class="form-label" data-i18n="top">上边距</span>
            <input type="number" id="marginTop" value="10" step="1" min="0" />
          </div>
          <div class="form-row">
            <span class="form-label" data-i18n="bottom">下边距</span>
            <input type="number" id="marginBottom" value="10" step="1" min="0" />
          </div>
          <div class="form-row">
            <span class="form-label" data-i18n="left">左边距</span>
            <input type="number" id="marginLeft" value="10" step="1" min="0" />
          </div>
          <div class="form-row">
            <span class="form-label" data-i18n="right">右边距</span>
            <input type="number" id="marginRight" value="10" step="1" min="0" />
          </div>
        </div>
      </div>

      <!-- 打孔定位标记 -->
      <div class="form-section">
        <div class="section-title">
          <span>🔘</span><span data-i18n="punch_marker">打孔定位标记</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label class="checkbox-item"><input type="checkbox" id="chkPunchNone" checked /> <span data-i18n="punch_none">无孔（不绘制打孔标记）</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchUS3" /> <span data-i18n="punch_us3">美式 3 孔活页夹 (左侧, 孔距 4.25 英寸)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchISO2" /> <span data-i18n="punch_iso2">2 孔 (左侧, 孔距 80 毫米)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchISO4" /> <span data-i18n="punch_iso4">4 孔 (左侧, 孔距 80 毫米)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchTop2" /> <span data-i18n="punch_top2">顶部 2 孔 (顶部夹子文件夹, 孔距 2.75 英寸)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="chkPunchSingle" /> <span data-i18n="punch_single">单环 (左上角)</span></label>
        </div>
      </div>

      <!-- 侧边栏设置 -->
      <div class="form-section">
        <div class="section-title">
          <span>📑</span><span data-i18n="sidebar_settings">侧边栏 / 线索栏</span>
        </div>
        <label class="checkbox-item"><input type="checkbox" id="chkEnableSidebar" /> <span data-i18n="enable_sidebar">启用侧边栏</span></label>
        <div id="sidebarOptionsBox" style="display:none; flex-direction:column; gap:6px; margin-top:4px;">
          <div style="display:flex; gap:10px;">
            <div class="form-row" style="flex:1;">
              <span class="form-label" data-i18n="position">位置</span>
              <select id="sidebarPosSelect">
                <option value="left" selected data-i18n="pos_left">左侧</option>
                <option value="right" data-i18n="pos_right">右侧</option>
              </select>
            </div>
            <div class="form-row" style="flex:1;">
              <span class="form-label" data-i18n="width_mm">宽度 (mm)</span>
              <input type="number" id="sidebarWidth" value="25" step="1" min="10" max="100" />
            </div>
          </div>
        </div>
      </div>

      <!-- 背景与水印 -->
      <div class="form-section">
        <div class="section-title">
          <span>🖼️</span><span data-i18n="bg_watermark">背景与底色</span>
        </div>
        <div class="form-row">
          <span class="form-label" data-i18n="bg_color">背景颜色</span>
          <div class="color-preset-list">
            <div class="preset-dot" style="background:#ffffff;" data-color="#ffffff"></div>
            <div class="preset-dot" style="background:#fcfaf2;" data-color="#fcfaf2"></div>
            <div class="preset-dot" style="background:#f4f7f6;" data-color="#f4f7f6"></div>
            <div class="preset-dot" style="background:#eef6fc;" data-color="#eef6fc"></div>
            <div class="preset-dot" style="background:#fdf2f4;" data-color="#fdf2f4"></div>
            <div class="preset-dot" style="background:#fbf8eb;" data-color="#fbf8eb"></div>
          </div>
        </div>
        <div class="form-row" style="margin-top:6px;">
          <span class="form-label" data-i18n="bg_texture">背景纹理</span>
          <select id="bgTextureSelect">
            <option value="none" selected data-i18n="texture_none">无纹理</option>
            <option value="grid" data-i18n="texture_grid">网格微纹理</option>
            <option value="dots" data-i18n="texture_dots">点状微纹理</option>
            <option value="slash" data-i18n="texture_slash">斜条纹 (/)</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- 右侧画板预览区 -->
    <section class="preview-viewport">
      <!-- 视口工具条 -->
      <div class="viewport-toolbar">
        <div class="toolbar-left">
          <span class="badge-info" id="badgePaperInfo">缝纫裁剪格纸 · A4 纵向</span>
          <span id="badgePaperDimension">210 × 297 mm</span>
          <span style="color:#79857d;">300 DPI 矢量精度</span>
        </div>
        <div class="toolbar-right">
          <button class="btn-tool" id="btnZoomOut">🔍 -</button>
          <span id="zoomPercentText">55%</span>
          <button class="btn-tool" id="btnZoomIn">🔍 +</button>
          <button class="btn-tool" id="btnFitWindow" data-i18n="fit_window">适应视口</button>
        </div>
      </div>

      <!-- 画布外围居中滚动区 -->
      <div class="canvas-scroll-container" id="scrollContainer">
        <div class="paper-sheet" id="paperSheet">
          <canvas id="renderCanvas"></canvas>
        </div>
      </div>

    // ==========================================
    // 物理尺寸对照表 (毫米 mm)
    // ==========================================
    const PAPER_SIZES_MM = {
      'A4': { w: 210, h: 297 },
      'A5': { w: 148, h: 210 },
      'A3': { w: 297, h: 420 },
      'B5': { w: 176, h: 250 },
      'Letter': { w: 215.9, h: 279.4 },
      'Legal': { w: 215.9, h: 355.6 }
    };

    // ==========================================
    // 主题色板预设
    // ==========================================
    const THEME_PRESETS = {
      vintage: { line: '#8b5a2b', bg: '#fcfaf2' },
      default: { line: '#4a5b5c', bg: '#ffffff' },
      dark: { line: '#1f2421', bg: '#f5f5f5' },
      classic: { line: '#2c4a6f', bg: '#ffffff' },
      marine: { line: '#0f6479', bg: '#f2f8fa' },
      forest: { line: '#205c3b', bg: '#f4f8f4' },
      sunset: { line: '#a34828', bg: '#fdf7f4' }
    };

    // ==========================================
    // 核心应用状态管理
    // ==========================================
    const state = {
      lang: 'zh',
      isMono: false,
      paperType: 'sewing',
      standardSize: 'A4',
      isLandscape: false,
      unit: 'mm',
      lineColor: '#8b5a2b',
      bgColor: '#ffffff',
      lineDash: 'solid',
      lineWidth: 0.6,
      gridSpacingMm: 10,
      boldStep: 5,
      marginTopMm: 10,
      marginBottomMm: 10,
      marginLeftMm: 10,
      marginRightMm: 10,
      texture: 'none',
      enableSidebar: false,
      sidebarPos: 'left',
      sidebarWidthMm: 25,
      punch: {
        none: true,
        us3: false,
        iso2: false,
        iso4: false,
        top2: false,
        single: false
      },
      zoom: 0.55
    };

    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const paperSheet = document.getElementById('paperSheet');

    // 逻辑 DPI: 打印基准使用 300 DPI
    const RENDER_DPI = 300;
    const MM_TO_INCH = 1 / 25.4;
    const MM_TO_PX = (RENDER_DPI * MM_TO_INCH);

    // ==========================================
    // 界面语言切换逻辑
    // ==========================================
    function setLanguage(langKey) {
      state.lang = langKey;
      const dict = I18N_DICT[langKey] || I18N_DICT.zh;

      document.getElementById('uiBrandTitle').textContent = dict.brand;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (dict[k]) el.textContent = dict[k];
      });

      document.getElementById('printerHint').textContent = state.isMono ? dict.printer_hint_mono : dict.printer_hint;
      updateToolbarInfo();
    }

    // ==========================================
    // 核心矢量绘制调度引擎
    // ==========================================
    function drawPaper() {
      const sizeDef = PAPER_SIZES_MM[state.standardSize] || PAPER_SIZES_MM['A4'];
      const rawW_mm = state.isLandscape ? sizeDef.h : sizeDef.w;
      const rawH_mm = state.isLandscape ? sizeDef.w : sizeDef.h;

      // 计算真实像素宽度
      const widthPx = Math.round(rawW_mm * MM_TO_PX);
      const heightPx = Math.round(rawH_mm * MM_TO_PX);

      canvas.width = widthPx;
      canvas.height = heightPx;

      paperSheet.style.width = (widthPx * state.zoom) + 'px';
      paperSheet.style.height = (heightPx * state.zoom) + 'px';
      canvas.style.width = (widthPx * state.zoom) + 'px';
      canvas.style.height = (heightPx * state.zoom) + 'px';

      // 1. 填充背景底色
      ctx.fillStyle = state.bgColor;
      ctx.fillRect(0, 0, widthPx, heightPx);

      // 2. 绘制背景微纹理
      if (state.texture !== 'none') {
        drawBackgroundTexture(ctx, widthPx, heightPx, state.texture);
      }

      // 3. 计算页面可绘图物理边界
      const topPx = state.marginTopMm * MM_TO_PX;
      const bottomPx = heightPx - (state.marginBottomMm * MM_TO_PX);
      let leftPx = state.marginLeftMm * MM_TO_PX;
      let rightPx = widthPx - (state.marginRightMm * MM_TO_PX);

      // 4. 处理侧边栏区域
      if (state.enableSidebar) {
        const sideW_Px = state.sidebarWidthMm * MM_TO_PX;
        ctx.save();
        ctx.strokeStyle = state.isMono ? '#333333' : state.lineColor;
        ctx.lineWidth = Math.max(1.8, state.lineWidth * 2.5);

        if (state.sidebarPos === 'left') {
          const splitX = leftPx + sideW_Px;
          ctx.beginPath();
          ctx.moveTo(splitX, topPx);
          ctx.lineTo(splitX, bottomPx);
          ctx.stroke();
          leftPx = splitX; // 留出侧边栏，主体网格往右缩排
        } else {
          const splitX = rightPx - sideW_Px;
          ctx.beginPath();
          ctx.moveTo(splitX, topPx);
          ctx.lineTo(splitX, bottomPx);
          ctx.stroke();
          rightPx = splitX;
        }
        ctx.restore();
      }

      // 5. 设置线条样式
      const baseLineColor = state.isMono ? '#444444' : state.lineColor;
      const boldLineColor = state.isMono ? '#111111' : state.lineColor;
      const lineStepPx = state.gridSpacingMm * MM_TO_PX;

      ctx.save();
      ctx.strokeStyle = baseLineColor;
      ctx.lineWidth = state.lineWidth * 1.5;

      if (state.lineDash === 'dashed') {
        ctx.setLineDash([12, 8]);
      } else if (state.lineDash === 'dotted') {
        ctx.setLineDash([3, 6]);
      } else {
        ctx.setLineDash([]);
      }

      // 6. 执行各类纸张的模板算法
      renderPaperTemplate(ctx, state.paperType, leftPx, topPx, rightPx, bottomPx, lineStepPx, baseLineColor, boldLineColor);
      ctx.restore();

      // 7. 叠加打孔定位记号
      if (!state.punch.none) {
        drawPunchMarkers(ctx, widthPx, heightPx);
      }

      updateToolbarInfo(rawW_mm, rawH_mm);
    }

    // ==========================================
    // 各模板矢量算法具体实现
    // ==========================================
    function renderPaperTemplate(ctx, type, left, top, right, bottom, step, baseColor, boldColor) {
      switch (type) {
        case 'grid':
        case 'sewing': {
          // 方格网格与缝纫裁剪纸
          let col = 0;
          for (let x = left; x <= right + 0.5; x += step) {
            const isMajor = state.boldStep > 0 && (col % state.boldStep === 0);
            ctx.lineWidth = isMajor ? state.lineWidth * 3.2 : state.lineWidth * 1.4;
            ctx.strokeStyle = isMajor ? boldColor : baseColor;
            ctx.beginPath();
            ctx.moveTo(x, top);
            ctx.lineTo(x, bottom);
            ctx.stroke();
            col++;
          }
          let row = 0;
          for (let y = top; y <= bottom + 0.5; y += step) {
            const isMajor = state.boldStep > 0 && (row % state.boldStep === 0);
            ctx.lineWidth = isMajor ? state.lineWidth * 3.2 : state.lineWidth * 1.4;
            ctx.strokeStyle = isMajor ? boldColor : baseColor;
            ctx.beginPath();
            ctx.moveTo(left, y);
            ctx.lineTo(right, y);
            ctx.stroke();
            row++;
          }
          break;
        }

        case 'lined': {
          // 横线纸
          for (let y = top; y <= bottom + 0.5; y += step) {
            ctx.beginPath();
            ctx.moveTo(left, y);
            ctx.lineTo(right, y);
            ctx.stroke();
          }
          break;
        }

        case 'vertical_lined': {
          // 竖线信纸
          for (let x = left; x <= right + 0.5; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, top);
            ctx.lineTo(x, bottom);
            ctx.stroke();
          }
          break;
        }

        case 'dot': {
          // 点阵纸 (Dot Matrix)
          ctx.fillStyle = baseColor;
          const dotRadius = state.lineWidth * 1.8;
          for (let x = left; x <= right + 0.5; x += step) {
            for (let y = top; y <= bottom + 0.5; y += step) {
              ctx.beginPath();
              ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }

        case 'mi_zi_ge':
        case 'tian_zi_ge': {
          // 书法练习格（米字格、田字格）
          const cellSize = step * 1.8;
          for (let x = left; x + cellSize <= right + 1; x += cellSize) {
            for (let y = top; y + cellSize <= bottom + 1; y += cellSize) {
              // 外框实线
              ctx.setLineDash([]);
              ctx.lineWidth = state.lineWidth * 2.2;
              ctx.strokeStyle = boldColor;
              ctx.strokeRect(x, y, cellSize, cellSize);

              // 内部十字虚线
              ctx.setLineDash([8, 8]);
              ctx.lineWidth = state.lineWidth * 1.0;
              ctx.strokeStyle = baseColor;

              ctx.beginPath();
              ctx.moveTo(x + cellSize / 2, y);
              ctx.lineTo(x + cellSize / 2, y + cellSize);
              ctx.moveTo(x, y + cellSize / 2);
              ctx.lineTo(x + cellSize, y + cellSize / 2);
              ctx.stroke();

              // 米字格对角线
              if (type === 'mi_zi_ge') {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + cellSize, y + cellSize);
                ctx.moveTo(x + cellSize, y);
                ctx.lineTo(x, y + cellSize);
                ctx.stroke();
              }
            }
          }
          break;
        }

        case 'music_stave': {
          // 五线谱纸
          const staveGap = step * 0.4;
          const groupGap = step * 2.5;
          let curY = top;
          while (curY + staveGap * 4 <= bottom) {
            ctx.setLineDash([]);
            ctx.lineWidth = state.lineWidth * 1.5;
            for (let i = 0; i < 5; i++) {
              const y = curY + i * staveGap;
              ctx.beginPath();
              ctx.moveTo(left, y);
              ctx.lineTo(right, y);
              ctx.stroke();
            }
            curY += staveGap * 4 + groupGap;
          }
          break;
        }

        case 'cornell': {
          // 康奈尔笔记纸
          const cueWidth = (right - left) * 0.3;
          const summaryHeight = (bottom - top) * 0.22;
          const mainBottom = bottom - summaryHeight;

          ctx.setLineDash([]);
          ctx.lineWidth = state.lineWidth * 2.8;
          // 划分线索栏纵线
          ctx.beginPath();
          ctx.moveTo(left + cueWidth, top);
          ctx.lineTo(left + cueWidth, mainBottom);
          ctx.stroke();

          // 划分总结栏横线
          ctx.beginPath();
          ctx.moveTo(left, mainBottom);
          ctx.lineTo(right, mainBottom);
          ctx.stroke();

          // 右上主记录区横线
          ctx.lineWidth = state.lineWidth * 1.2;
          for (let y = top + step; y < mainBottom - 5; y += step) {
            ctx.beginPath();
            ctx.moveTo(left + cueWidth, y);
            ctx.lineTo(right, y);
            ctx.stroke();
          }
          break;
        }

        case 'polar': {
          // 极坐标图纸
          const cx = (left + right) / 2;
          const cy = (top + bottom) / 2;
          const maxR = Math.min((right - left), (bottom - top)) / 2;

          ctx.setLineDash([]);
          // 同心圆
          for (let r = step; r <= maxR; r += step) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
          }
          // 30度放射线
          for (let deg = 0; deg < 360; deg += 30) {
            const rad = deg * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(rad) * maxR, cy + Math.sin(rad) * maxR);
            ctx.stroke();
          }
          break;
        }

        case 'blank':
        default:
          break;
      }
    }

    // 背景微纹理生成器
    function drawBackgroundTexture(ctx, w, h, texType) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.04)';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
      ctx.lineWidth = 1;

      if (texType === 'slash') {
        const gap = 24;
        for (let x = -h; x < w; x += gap) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + h, h);
          ctx.stroke();
        }
      } else if (texType === 'dots') {
        const gap = 30;
        for (let x = 10; x < w; x += gap) {
          for (let y = 10; y < h; y += gap) {
            ctx.fillRect(x, y, 2, 2);
          }
        }
      } else if (texType === 'grid') {
        const gap = 20;
        for (let x = 0; x < w; x += gap) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += gap) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
      }
      ctx.restore();
    }

    // 打孔定位圆点绘制
    function drawPunchMarkers(ctx, w, h) {
      ctx.save();
      ctx.fillStyle = 'rgba(20, 20, 20, 0.85)';
      ctx.strokeStyle = 'rgba(20, 20, 20, 0.85)';
      ctx.lineWidth = 2;

      const punchR = 4 * (RENDER_DPI / 72); // 标准孔半径
      const edgeDist = 9.5 * MM_TO_PX; // 距纸边缘约 9.5mm

      function drawHole(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, punchR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      const centerY = h / 2;

      // 美式 3 孔 (4.25 英寸间距)
      if (state.punch.us3) {
        const gap = 4.25 * 25.4 * MM_TO_PX;
        drawHole(edgeDist, centerY);
        drawHole(edgeDist, centerY - gap);
        drawHole(edgeDist, centerY + gap);
      }

      // 国标 ISO 2 孔 (80 mm 间距)
      if (state.punch.iso2) {
        const gap = (80 / 2) * MM_TO_PX;
        drawHole(edgeDist, centerY - gap);
        drawHole(edgeDist, centerY + gap);
      }

      // 国标 ISO 4 孔 (80 mm 间距)
      if (state.punch.iso4) {
        const half = 40 * MM_TO_PX;
        const outer = 120 * MM_TO_PX;
        drawHole(edgeDist, centerY - half);
        drawHole(edgeDist, centerY + half);
        drawHole(edgeDist, centerY - outer);
        drawHole(edgeDist, centerY + outer);
      }

      // 顶部两孔
      if (state.punch.top2) {
        const gap = (2.75 * 25.4 / 2) * MM_TO_PX;
        const centerX = w / 2;
        drawHole(centerX - gap, edgeDist);
        drawHole(centerX + gap, edgeDist);
      }

      // 单环 (左上角)
      if (state.punch.single) {
        drawHole(edgeDist * 1.5, edgeDist * 1.5);
      }

      ctx.restore();
    }

    // 状态栏尺寸与信息更新
    function updateToolbarInfo(w_mm, h_mm) {
      if (!w_mm) {
        const def = PAPER_SIZES_MM[state.standardSize] || PAPER_SIZES_MM['A4'];
        w_mm = state.isLandscape ? def.h : def.w;
        h_mm = state.isLandscape ? def.w : def.h;
      }
      const typeName = document.getElementById('paperTypeSelect').selectedOptions[0].text;
      const orientName = state.isLandscape ? '横向' : '纵向';
      document.getElementById('badgePaperInfo').textContent = `${typeName} · ${state.standardSize} ${orientName}`;
      document.getElementById('badgePaperDimension').textContent = `${Math.round(w_mm)} × ${Math.round(h_mm)} mm`;
      document.getElementById('zoomPercentText').textContent = Math.round(state.zoom * 100) + '%';
    }

    // ==========================================
    // 导出引擎：PDF、SVG、PNG、原生打印
    // ==========================================
    document.getElementById('btnExportPDF').onclick = function() {
      const { jsPDF } = window.jspdf;
      const sizeDef = PAPER_SIZES_MM[state.standardSize] || PAPER_SIZES_MM['A4'];
      const w_mm = state.isLandscape ? sizeDef.h : sizeDef.w;
      const h_mm = state.isLandscape ? sizeDef.w : sizeDef.h;

      const pdf = new jsPDF({
        orientation: state.isLandscape ? 'landscape' : 'portrait',
        unit: 'mm',
        format: [w_mm, h_mm]
      });

      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(imgData, 'JPEG', 0, 0, w_mm, h_mm);
      pdf.save(`PaperMe-${state.paperType}-${state.standardSize}.pdf`);
    };

    document.getElementById('btnExportPNG').onclick = function() {
      const link = document.createElement('a');
      link.download = `PaperMe-${state.paperType}-${state.standardSize}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    document.getElementById('btnExportSVG').onclick = function() {
      const sizeDef = PAPER_SIZES_MM[state.standardSize] || PAPER_SIZES_MM['A4'];
      const w_mm = state.isLandscape ? sizeDef.h : sizeDef.w;
      const h_mm = state.isLandscape ? sizeDef.w : sizeDef.h;

      const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${w_mm}mm" height="${h_mm}mm" viewBox="0 0 ${canvas.width} ${canvas.height}">
  <image href="${canvas.toDataURL('image/png')}" width="${canvas.width}" height="${canvas.height}"/>
</svg>`;

      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.download = `PaperMe-${state.paperType}.svg`;
      link.href = URL.createObjectURL(blob);
      link.click();
    };

    document.getElementById('btnPrint').onclick = function() {
      window.print();
    };

    // ==========================================
    // 事件监听与交互绑定
    // ==========================================
    document.getElementById('langSelect').onchange = (e) => setLanguage(e.target.value);

    // 打印机模式
    const btnColor = document.getElementById('btnPrinterColor');
    const btnMono = document.getElementById('btnPrinterMono');
    btnColor.onclick = () => {
      btnColor.classList.add('active');
      btnMono.classList.remove('active');
      state.isMono = false;
      setLanguage(state.lang);
      drawPaper();
    };
    btnMono.onclick = () => {
      btnMono.classList.add('active');
      btnColor.classList.remove('active');
      state.isMono = true;
      setLanguage(state.lang);
      drawPaper();
    };

    // 纸型、尺寸、方向
    document.getElementById('paperTypeSelect').onchange = (e) => { state.paperType = e.target.value; drawPaper(); };
    document.getElementById('paperStandardSelect').onchange = (e) => { state.standardSize = e.target.value; drawPaper(); };

    const btnV = document.getElementById('btnOrientV');
    const btnH = document.getElementById('btnOrientH');
    btnV.onclick = () => { btnV.classList.add('active'); btnH.classList.remove('active'); state.isLandscape = false; drawPaper(); };
    btnH.onclick = () => { btnH.classList.add('active'); btnV.classList.remove('active'); state.isLandscape = true; drawPaper(); };

    // 主题色联动
    document.getElementById('themeSelect').onchange = (e) => {
      const theme = THEME_PRESETS[e.target.value];
      if (theme) {
        state.lineColor = theme.line;
        state.bgColor = theme.bg;
        document.getElementById('lineColorPicker').value = theme.line;
        document.getElementById('lineColorText').value = theme.line;
        drawPaper();
      }
    };

    // 线条与间距
    const lineColorPicker = document.getElementById('lineColorPicker');
    const lineColorText = document.getElementById('lineColorText');
    lineColorPicker.oninput = (e) => { state.lineColor = e.target.value; lineColorText.value = e.target.value; drawPaper(); };
    lineColorText.onchange = (e) => { state.lineColor = e.target.value; lineColorPicker.value = e.target.value; drawPaper(); };

    document.getElementById('lineDashSelect').onchange = (e) => { state.lineDash = e.target.value; drawPaper(); };
    document.getElementById('inputLineWidth').oninput = (e) => { state.lineWidth = parseFloat(e.target.value) || 0.6; drawPaper(); };
    document.getElementById('inputGridSpacing').oninput = (e) => { state.gridSpacingMm = parseFloat(e.target.value) || 10; drawPaper(); };
    document.getElementById('inputBoldStep').oninput = (e) => { state.boldStep = parseInt(e.target.value) || 0; drawPaper(); };

    // 边距
    document.getElementById('marginTop').oninput = (e) => { state.marginTopMm = parseFloat(e.target.value) || 0; drawPaper(); };
    document.getElementById('marginBottom').oninput = (e) => { state.marginBottomMm = parseFloat(e.target.value) || 0; drawPaper(); };
    document.getElementById('marginLeft').oninput = (e) => { state.marginLeftMm = parseFloat(e.target.value) || 0; drawPaper(); };
    document.getElementById('marginRight').oninput = (e) => { state.marginRightMm = parseFloat(e.target.value) || 0; drawPaper(); };

    // 打孔逻辑交互
    const chkNone = document.getElementById('chkPunchNone');
    const punchCheckboxes = [
      document.getElementById('chkPunchUS3'),
      document.getElementById('chkPunchISO2'),
      document.getElementById('chkPunchISO4'),
      document.getElementById('chkPunchTop2'),
      document.getElementById('chkPunchSingle')
    ];

    chkNone.onchange = () => {
      if (chkNone.checked) {
        punchCheckboxes.forEach(cb => cb.checked = false);
        state.punch = { none: true, us3: false, iso2: false, iso4: false, top2: false, single: false };
      } else {
        state.punch.none = false;
      }
      drawPaper();
    };

    punchCheckboxes.forEach(cb => {
      cb.onchange = () => {
        state.punch.us3 = document.getElementById('chkPunchUS3').checked;
        state.punch.iso2 = document.getElementById('chkPunchISO2').checked;
        state.punch.iso4 = document.getElementById('chkPunchISO4').checked;
        state.punch.top2 = document.getElementById('chkPunchTop2').checked;
        state.punch.single = document.getElementById('chkPunchSingle').checked;

        const anyChecked = punchCheckboxes.some(c => c.checked);
        state.punch.none = !anyChecked;
        chkNone.checked = !anyChecked;
        drawPaper();
      };
    });

    // 侧边栏
    const chkSidebar = document.getElementById('chkEnableSidebar');
    const sidebarBox = document.getElementById('sidebarOptionsBox');
    chkSidebar.onchange = (e) => {
      state.enableSidebar = e.target.checked;
      sidebarBox.style.display = e.target.checked ? 'flex' : 'none';
      drawPaper();
    };
    document.getElementById('sidebarPosSelect').onchange = (e) => { state.sidebarPos = e.target.value; drawPaper(); };
    document.getElementById('sidebarWidth').oninput = (e) => { state.sidebarWidthMm = parseFloat(e.target.value) || 25; drawPaper(); };

    // 底色色块点选
    document.querySelectorAll('.preset-dot').forEach(dot => {
      dot.onclick = () => {
        state.bgColor = dot.getAttribute('data-color');
        drawPaper();
      };
    });

    document.getElementById('bgTextureSelect').onchange = (e) => { state.texture = e.target.value; drawPaper(); };

    // 缩放控制
    document.getElementById('btnZoomIn').onclick = () => { state.zoom = Math.min(1.5, state.zoom + 0.05); drawPaper(); };
    document.getElementById('btnZoomOut').onclick = () => { state.zoom = Math.max(0.2, state.zoom - 0.05); drawPaper(); };
    document.getElementById('btnFitWindow').onclick = () => {
      const container = document.getElementById('scrollContainer');
      const availW = container.clientWidth - 80;
      const sizeDef = PAPER_SIZES_MM[state.standardSize] || PAPER_SIZES_MM['A4'];
      const rawW_mm = state.isLandscape ? sizeDef.h : sizeDef.w;
      const targetPx = rawW_mm * MM_TO_PX;
      state.zoom = Math.min(1.0, Math.max(0.3, availW / targetPx));
      drawPaper();
    };

    // 初始化运行
    window.addEventListener('DOMContentLoaded', () => {
      setLanguage('zh');
      drawPaper();
    });
  </script>
</body>
</html>
